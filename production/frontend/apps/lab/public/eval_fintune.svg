
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1890ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#096dd9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#722ed1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#531dab;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#52c41a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#389e0d;stop-opacity:1" />
    </linearGradient>
    
    <!-- 箭头定义 -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="5" refY="5"
      markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1890ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="5" refY="5"
      markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52c41a"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="5" refY="5"
      markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#722ed1"/>
    </marker>
    
    <!-- 阴影滤镜 -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode />
        <feMergeNode in="SourceGraphic" /> 
      </feMerge>
    </filter>
  </defs>

  <!-- 标题 -->
  <text x="450" y="50" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#262626">模型优化闭环系统</text>
  <text x="450" y="80" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#595959">"评估-微调-再评估"一体化解决方案</text>
  
  <!-- 循环背景 -->
  <ellipse cx="450" cy="280" rx="380" ry="180" fill="#f9f9f9" stroke="#d9d9d9" stroke-width="1" stroke-dasharray="5,3" />
  
  <!-- 蓝色模块：模型评估系统 -->
  <g transform="translate(150, 200)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="200" height="160" rx="10" fill="url(#blueGradient)" />
    <text x="100" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">模型评估系统</text>
    <text x="100" y="75" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">数据集管理</text>
    <text x="100" y="95" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">提示词设计</text>
    <text x="100" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">性能指标分析</text>
    <text x="100" y="135" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">模型对比评测</text>
  </g>
  
  <!-- 绿色模块：模型微调系统 -->
  <g transform="translate(550, 200)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="200" height="160" rx="10" fill="url(#greenGradient)" />
    <text x="100" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">模型微调系统</text>
    <text x="100" y="75" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">训练数据准备</text>
    <text x="100" y="95" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">资源调度管理</text>
    <text x="100" y="115" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">微调任务执行</text>
    <text x="100" y="135" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">模型部署应用</text>
  </g>
  
  <!-- 联动路径1：评估驱动微调 -->
  <g>
    <path d="M 350 240 C 400 220, 500 220, 550 240" stroke="#1890ff" stroke-width="3" fill="none" marker-end="url(#arrowBlue)" />
    <rect x="400" y="190" width="100" height="30" rx="15" fill="#e6f7ff" stroke="#1890ff" />
    <text x="450" y="210" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1890ff">评估驱动微调</text>
  </g>
  
  <!-- 联动路径2：微调验证评估 -->
  <g>
    <path d="M 550 320 C 500 340, 400 340, 350 320" stroke="#52c41a" stroke-width="3" fill="none" marker-end="url(#arrowGreen)" />
    <rect x="400" y="340" width="100" height="30" rx="15" fill="#f6ffed" stroke="#52c41a" />
    <text x="450" y="360" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#52c41a">微调验证评估</text>
  </g>

  <!-- 中央数据共享平台 -->
  <g transform="translate(375, 430)" filter="url(#dropShadow)">
    <rect x="0" y="0" width="150" height="60" rx="8" fill="url(#purpleGradient)" />
    <text x="75" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">统一数据共享平台</text>
    <text x="75" y="45" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">数据无缝转换与复用</text>
  </g>

  <!-- 数据共享连接线 -->
  <path d="M 250 360 C 280 410, 375 430, 375 430" stroke="#722ed1" stroke-width="2" stroke-dasharray="5,3" fill="none" />
  <path d="M 650 360 C 620 410, 525 430, 525 430" stroke="#722ed1" stroke-width="2" stroke-dasharray="5,3" fill="none" />

  <!-- 闭环说明 -->
  <g transform="translate(100, 520)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#262626">联动路径一: 评估驱动微调</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="14" fill="#595959">• 发现模型性能不足并自动转化为微调优化方案</text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="14" fill="#595959">• 针对性生成训练数据并启动定向优化任务</text>
  </g>
  
  <g transform="translate(500, 520)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#262626">联动路径二: 微调验证评估</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="14" fill="#595959">• 微调完成后自动触发标准评估验证流程</text>
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="14" fill="#595959">• 基于评估结果决定部署应用或继续优化</text>
  </g>
</svg>
